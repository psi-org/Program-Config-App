name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build app
        run: yarn run build

      - name: Locate build artifact
        id: artifact
        run: |
          ZIP_FILE=$(find build -name "*.zip" -type f | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip artifact found in build/. Directory contents:"
            ls -la build/ || echo "Build directory not found"
            exit 1
          fi
          echo "Found artifact: $ZIP_FILE"
          echo "zip_path=$ZIP_FILE" >> $GITHUB_OUTPUT

      # Creates a v2.2.1 tag at the initial commit on the first run so that
      # semantic-release treats all v3.0.0 commits as new. Subsequent runs
      # skip this step because a version tag will already exist.
      - name: Bootstrap baseline version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags
          if ! git tag -l | grep -qE "^v[0-9]+\.[0-9]+\.[0-9]+"; then
            ROOT_SHA=$(git rev-list --max-parents=0 HEAD)
            echo "No version tags found — bootstrapping v2.2.1 at root commit ${ROOT_SHA}"
            gh api repos/${{ github.repository }}/git/refs \
              --method POST \
              -f ref="refs/tags/v2.2.1" \
              -f sha="$ROOT_SHA"
          fi

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
